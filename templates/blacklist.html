<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚫 低质量岗位黑名单 — BOSS 直聘 AI 自动投递</title>
<style>
  :root {
    --bg: #f0f2f5; --card: #fff; --primary: #1a73e8;
    --success: #34a853; --warn: #fbbc04; --danger: #ea4335;
    --text: #202124; --text2: #5f6368; --border: #e0e0e0;
    --radius: 8px; --shadow: 0 2px 8px rgba(0,0,0,.08);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font: 14px/1.6 -apple-system, "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); padding: 16px;
  }
  .container { max-width: 1200px; margin: 0 auto; }
  .header {
    background: var(--card); border-radius: var(--radius);
    padding: 16px 24px; box-shadow: var(--shadow);
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px; flex-wrap: wrap; gap: 10px;
  }
  .header h1 { font-size: 20px; display: flex; align-items: center; gap: 8px; }
  .header h1 small { font-size: 13px; color: var(--text2); font-weight: normal; }
  .card {
    background: var(--card); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 16px 20px; margin-bottom: 16px;
  }
  .card-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
  .btn {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 6px 14px; border: none; border-radius: 6px;
    font-size: 13px; font-weight: 500; cursor: pointer;
    transition: all .15s; white-space: nowrap; text-decoration: none;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-outline { background: #fff; border: 1px solid var(--border); color: var(--text); }
  .btn-sm { padding: 4px 10px; font-size: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left; padding: 8px 6px; font-weight: 600;
    border-bottom: 2px solid var(--border); font-size: 12px; color: var(--text2);
    white-space: nowrap;
  }
  td { padding: 8px 6px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
  tr:hover td { background: #fafbfc; }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 10px;
    font-size: 12px; font-weight: 600; white-space: nowrap;
  }
  .badge-perm { background: #fce8e6; color: #d93025; }
  .badge-temp { background: #fef7e0; color: #b06000; }
  .badge-watch { background: #e8f0fe; color: #1a73e8; }
  .badge-expired { background: #e0e0e0; color: #5f6368; }
  .badge-src { background: #f1f3f4; color: var(--text2); font-weight: 500; }
  .link { color: var(--primary); text-decoration: none; word-break: break-all; }
  .link:hover { text-decoration: underline; }
  .empty-state { text-align: center; padding: 30px; color: var(--text2); font-size: 13px; }
  .meta-line { font-size: 12px; color: var(--text2); }
  .footer-note { margin-top: 12px; font-size: 12px; color: var(--text2); }

  /* 三级筛选标签 */
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .tab {
    padding: 5px 14px; border-radius: 16px; border: 1px solid var(--border);
    background: #fff; font-size: 13px; cursor: pointer; color: var(--text2);
    transition: all .15s;
  }
  .tab.active { background: var(--primary); border-color: var(--primary); color: #fff; }

  /* 手动添加表单 */
  .add-form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .add-form input, .add-form select {
    padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px;
    font-size: 13px;
  }
  .add-form input.url { width: 300px; }
  .add-form input.short { width: 140px; }

  .toast {
    position: fixed; top: 20px; right: 20px; padding: 12px 20px; border-radius: 6px;
    color: #fff; font-weight: 500; box-shadow: 0 4px 12px rgba(0,0,0,.15);
    z-index: 1000; transform: translateX(120%); transition: transform .3s;
  }
  .toast.show { transform: translateX(0); }
  .toast-success { background: var(--success); }
  .toast-error { background: var(--danger); }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <h1>🚫 低质量岗位黑名单 <small>永久/短期/观察 三级 · 命中直接跳过不读JD</small></h1>
    <div style="display:flex;align-items:center;gap:8px">
      <a class="btn btn-outline btn-sm" href="/">⬅ 返回控制面板</a>
      <button class="btn btn-primary btn-sm" onclick="refresh()">🔄 刷新</button>
      <button class="btn btn-danger btn-sm" onclick="clearAll()">🗑️ 清空全部</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">📋 手动添加</div>
    <div class="add-form">
      <input class="url" id="addUrl" placeholder="BOSS 岗位网址（必填，/job_detail/xxx.html）">
      <input class="short" id="addTitle" placeholder="岗位名称">
      <input class="short" id="addCompany" placeholder="公司">
      <input class="short" id="addReason" placeholder="原因（如 劳务外包）">
      <select id="addLevel">
        <option value="permanent">⛔ 永久</option>
        <option value="temporary">🕐 短期（30天）</option>
        <option value="watch">👀 观察</option>
      </select>
      <button class="btn btn-primary btn-sm" onclick="addJob()">➕ 添加</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title" style="display:flex;align-items:center;justify-content:space-between">
      <span>📋 黑名单 <span id="count" style="font-size:12px;color:var(--text2);font-weight:normal">(0 条)</span></span>
    </div>

    <div class="tabs">
      <button class="tab active" data-f="all" onclick="setFilter('all')">全部</button>
      <button class="tab" data-f="permanent" onclick="setFilter('permanent')">⛔ 永久</button>
      <button class="tab" data-f="temporary" onclick="setFilter('temporary')">🕐 短期</button>
      <button class="tab" data-f="watch" onclick="setFilter('watch')">👀 观察</button>
    </div>

    <div id="listArea"><div class="empty-state">加载中...</div></div>
    <div class="footer-note">
      💡 永久/短期：引擎遇到该 URL 直接跳过（不读 JD、不调 AI）；短期到期自动解除。
      👀 观察：评分过低先观察不跳过，再次命中仍低分自动升级永久；可在下方一键转永久/短期或忽略。
      数据保存在本地数据库（data/boss_jobs.db），仅本机可见。
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
let jobs = [];
let filter = 'all';

function showToast(msg, type = 'info') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type === 'success' ? 'toast-success' : type === 'error' ? 'toast-error' : '');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function escapeHtml(text) {
  const d = document.createElement('div');
  d.textContent = text == null ? '' : String(text);
  return d.innerHTML;
}

function levelBadge(j) {
  const now = new Date();
  if (j.level === 'permanent') return '<span class="badge badge-perm">⛔ 永久</span>';
  if (j.level === 'temporary') {
    const exp = j.expires_at || '';
    if (exp && new Date(exp.replace(' ', 'T')) < now) {
      return '<span class="badge badge-expired">🕐 已过期</span>';
    }
    return '<span class="badge badge-temp">🕐 短期</span>';
  }
  return '<span class="badge badge-watch">👀 观察</span>';
}

function sourceText(j) {
  return j.source === 'manual' ? '人工' : '自动';
}

function setFilter(f) {
  filter = f;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.f === f));
  render();
}

function render() {
  const area = document.getElementById('listArea');
  const list = filter === 'all' ? jobs : jobs.filter(j => j.level === filter);
  document.getElementById('count').textContent = `(${list.length} 条)`;

  if (!list.length) {
    area.innerHTML = '<div class="empty-state">暂无黑名单岗位<br>引擎运行时 AI 判定「劳务外包/岗位名与JD不符/评分过低」等会按级别自动拉黑</div>';
    return;
  }

  let html = `<div style="overflow-x:auto">
    <table style="min-width:1080px">
      <tr>
        <th>级别</th><th>岗位名称</th><th>公司</th><th>原因</th>
        <th>来源</th><th>评分</th><th>BOSS 网址</th><th>时间</th><th>操作</th>
      </tr>`;
  for (const j of list) {
    const expInfo = (j.level === 'temporary' && j.expires_at) ? `<div class="meta-line">${escapeHtml(j.expires_at)} 解除</div>` : '';
    const watchBtns = j.level === 'watch' ? `
        <button class="btn btn-outline btn-sm" onclick="changeLevel(${j.id},'permanent')">⛔ 永久</button>
        <button class="btn btn-outline btn-sm" onclick="changeLevel(${j.id},'temporary')">🕐 短期</button>` : '';
    html += `<tr>
      <td>${levelBadge(j)}${expInfo}</td>
      <td><strong>${escapeHtml(j.job_title || '未知岗位')}</strong></td>
      <td>${escapeHtml(j.company || '-')}</td>
      <td>${escapeHtml(j.reason || '-')}</td>
      <td><span class="badge badge-src">${sourceText(j)}</span></td>
      <td>${j.match_score || 0}分</td>
      <td>${j.url ? `<a class="link" href="${escapeHtml(j.url)}" target="_blank" rel="noopener">打开岗位 ↗</a>` : '-'}</td>
      <td class="meta-line">${escapeHtml(j.created_at || '')}</td>
      <td style="white-space:nowrap">
        ${watchBtns}
        <button class="btn btn-danger btn-sm" onclick="delJob(${j.id})">🗑️ 忽略</button>
      </td>
    </tr>`;
  }
  html += '</table></div>';
  area.innerHTML = html;
}

async function refresh() {
  try {
    const r = await fetch('/api/blacklist');
    const data = await r.json();
    jobs = Array.isArray(data) ? data : (data.jobs || []);
    render();
  } catch(e) {
    showToast('加载失败: ' + e.message, 'error');
  }
}

async function addJob() {
  const url = document.getElementById('addUrl').value.trim();
  if (!url) { showToast('请填写岗位网址', 'error'); return; }
  const body = {
    url: url,
    job_title: document.getElementById('addTitle').value.trim(),
    company: document.getElementById('addCompany').value.trim(),
    reason: document.getElementById('addReason').value.trim() || '人工添加',
    level: document.getElementById('addLevel').value,
  };
  try {
    const r = await fetch('/api/blacklist', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const d = await r.json();
    if (d.success) {
      showToast('✅ 已添加', 'success');
      document.getElementById('addUrl').value = '';
      refresh();
    } else {
      showToast('添加失败: ' + (d.error || ''), 'error');
    }
  } catch(e) {
    showToast('添加失败: ' + e.message, 'error');
  }
}

async function changeLevel(id, level) {
  try {
    const r = await fetch('/api/blacklist/' + id, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ level: level }),
    });
    const d = await r.json();
    if (d.success) {
      showToast('✅ 已更新等级', 'success');
      refresh();
    } else {
      showToast('更新失败: ' + (d.error || ''), 'error');
    }
  } catch(e) {
    showToast('更新失败: ' + e.message, 'error');
  }
}

async function delJob(id) {
  if (!confirm('确定忽略该条黑名单？解除后可再次评估该岗位')) return;
  try {
    const r = await fetch('/api/blacklist/' + id, { method: 'DELETE' });
    const d = await r.json();
    if (d.success) {
      showToast('✅ 已忽略', 'success');
      refresh();
    } else {
      showToast('删除失败: ' + (d.error || ''), 'error');
    }
  } catch(e) {
    showToast('删除失败: ' + e.message, 'error');
  }
}

async function clearAll() {
  if (!jobs.length) { showToast('暂无记录', 'info'); return; }
  if (!confirm('确定清空全部黑名单？此操作不可恢复！')) return;
  try {
    const r = await fetch('/api/blacklist/clear', { method: 'POST' });
    const d = await r.json();
    if (d.success) {
      showToast(`✅ 已清空 ${d.cleared || 0} 条`, 'success');
      refresh();
    } else {
      showToast('清空失败: ' + (d.error || ''), 'error');
    }
  } catch(e) {
    showToast('清空失败: ' + e.message, 'error');
  }
}

// 每 30 秒自动刷新
refresh();
setInterval(refresh, 30000);
</script>
</body>
</html>
