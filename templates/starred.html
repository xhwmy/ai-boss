<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⭐ 超预期岗位收藏 — BOSS 直聘 AI 自动投递</title>
<style>
  :root {
    --bg: #f0f2f5; --card: #fff; --primary: #1a73e8;
    --success: #34a853; --warn: #fbbc04; --danger: #ea4335;
    --text: #202124; --text2: #5f6368; --border: #e0e0e0;
    --radius: 8px; --shadow: 0 2px 8px rgba(0,0,0,.08);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font: 14px/1.6 -apple-system, "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); padding: 16px;
  }
  .container { max-width: 1200px; margin: 0 auto; }
  .header {
    background: var(--card); border-radius: var(--radius);
    padding: 16px 24px; box-shadow: var(--shadow);
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px; flex-wrap: wrap; gap: 10px;
  }
  .header h1 { font-size: 20px; display: flex; align-items: center; gap: 8px; }
  .header h1 small { font-size: 13px; color: var(--text2); font-weight: normal; }
  .card {
    background: var(--card); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 16px 20px;
  }
  .card-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
  .btn {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 6px 14px; border: none; border-radius: 6px;
    font-size: 13px; font-weight: 500; cursor: pointer;
    transition: all .15s; white-space: nowrap; text-decoration: none;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-outline { background: #fff; border: 1px solid var(--border); color: var(--text); }
  .btn-sm { padding: 4px 10px; font-size: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left; padding: 8px 6px; font-weight: 600;
    border-bottom: 2px solid var(--border); font-size: 12px; color: var(--text2);
    white-space: nowrap;
  }
  td { padding: 8px 6px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
  tr:hover td { background: #fafbfc; }
  .badge-score {
    display: inline-block; padding: 2px 8px; border-radius: 10px;
    font-size: 12px; font-weight: 600;
  }
  .badge-star { background: #e8f0fe; color: #1a73e8; }
  .badge-tag {
    display: inline-block; padding: 1px 6px; border-radius: 4px;
    background: #f1f3f4; color: var(--text2); font-size: 11px; margin-right: 4px;
  }
  .link { color: var(--primary); text-decoration: none; word-break: break-all; }
  .link:hover { text-decoration: underline; }
  .empty-state { text-align: center; padding: 30px; color: var(--text2); font-size: 13px; }
  .meta-line { font-size: 12px; color: var(--text2); }
  .footer-note { margin-top: 12px; font-size: 12px; color: var(--text2); }

  /* JD 弹窗 */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 999;
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: #fff; border-radius: 10px; max-width: 720px; width: 100%;
    max-height: 82vh; display: flex; flex-direction: column;
    box-shadow: 0 8px 30px rgba(0,0,0,.25);
  }
  .modal-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; border-bottom: 1px solid var(--border); font-weight: 600;
  }
  .modal-body { padding: 16px 18px; overflow-y: auto; white-space: pre-wrap;
    font-size: 13px; line-height: 1.8; color: var(--text); }
  .modal-close {
    background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text2);
    line-height: 1; padding: 0 4px;
  }
  .toast {
    position: fixed; top: 20px; right: 20px; padding: 12px 20px; border-radius: 6px;
    color: #fff; font-weight: 500; box-shadow: 0 4px 12px rgba(0,0,0,.15);
    z-index: 1000; transform: translateX(120%); transition: transform .3s;
  }
  .toast.show { transform: translateX(0); }
  .toast-success { background: var(--success); }
  .toast-error { background: var(--danger); }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <h1>⭐ 超预期岗位收藏 <small>AI 评分 ≥ 超预期阈值 自动收藏 · 历史留存</small></h1>
    <div style="display:flex;align-items:center;gap:8px">
      <a class="btn btn-outline btn-sm" href="/">⬅ 返回控制面板</a>
      <button class="btn btn-primary btn-sm" onclick="refresh()">🔄 刷新</button>
      <button class="btn btn-danger btn-sm" onclick="clearAll()">🗑️ 清空全部</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">
      📋 历史超预期岗位
      <span id="count" style="font-size:12px;color:var(--text2);font-weight:normal">(0 条)</span>
    </div>
    <div id="listArea"><div class="empty-state">加载中...</div></div>
    <div class="footer-note">
      💡 点击「BOSS 网址」可跳转到 BOSS 直聘岗位页查看详情；点击「JD」可展开完整岗位描述。
      数据保存在本地数据库（data/boss_jobs.db），仅本机可见。
    </div>
  </div>

</div>

<!-- JD 弹窗 -->
<div class="modal-mask" id="modalMask" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-head">
      <span id="modalTitle">岗位 JD</span>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let jobs = [];

function showToast(msg, type = 'info') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type === 'success' ? 'toast-success' : type === 'error' ? 'toast-error' : '');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function escapeHtml(text) {
  const d = document.createElement('div');
  d.textContent = text == null ? '' : String(text);
  return d.innerHTML;
}

function listedText(j) {
  if (j.listed === 1) return '已上市';
  if (j.listed === 0) return '未上市';
  return '';
}

function render() {
  const area = document.getElementById('listArea');
  document.getElementById('count').textContent = `(${jobs.length} 条)`;

  if (!jobs.length) {
    area.innerHTML = '<div class="empty-state">暂无超预期岗位<br>引擎运行时 AI 评分 ≥ 超预期阈值的岗位会自动收藏到这里</div>';
    return;
  }

  let html = `<div style="overflow-x:auto">
    <table style="min-width:1080px">
      <tr>
        <th>匹配度</th><th>岗位名称</th><th>公司</th>
        <th>规模 / 上市 / 行业</th><th>薪资</th><th>城市</th>
        <th>学历</th><th>经验</th><th>BOSS 网址</th><th>收藏时间</th><th>操作</th>
      </tr>`;
  for (const j of jobs) {
    const tags = [];
    if (j.company_size) tags.push(escapeHtml(j.company_size));
    const lt = listedText(j);
    if (lt) tags.push(lt + (j.financing && j.financing !== '已上市' ? '·' + escapeHtml(j.financing) : ''));
    else if (j.financing) tags.push(escapeHtml(j.financing));
    if (j.industry) tags.push(escapeHtml(j.industry));

    html += `<tr>
      <td><span class="badge-score badge-star">${j.match_score || 0}分</span></td>
      <td><strong>${escapeHtml(j.job_title || '未知岗位')}</strong></td>
      <td>${escapeHtml(j.company || '-')}</td>
      <td>${tags.length ? tags.map(t => `<span class="badge-tag">${t}</span>`).join('') : '-'}</td>
      <td>${escapeHtml(j.salary || '-')}</td>
      <td>${escapeHtml(j.city || '-')}</td>
      <td>${escapeHtml(j.education || '-')}</td>
      <td>${escapeHtml(j.experience || '-')}</td>
      <td>${j.url ? `<a class="link" href="${escapeHtml(j.url)}" target="_blank" rel="noopener">打开岗位 ↗</a>` : '-'}</td>
      <td class="meta-line">${escapeHtml(j.created_at || '')}</td>
      <td style="white-space:nowrap">
        ${j.jd_text ? `<button class="btn btn-outline btn-sm" onclick="showJd(${j.id})">📄 JD</button> ` : ''}
        <button class="btn btn-danger btn-sm" onclick="delJob(${j.id})">🗑️ 删除</button>
      </td>
    </tr>`;
  }
  html += '</table></div>';
  area.innerHTML = html;
}

async function refresh() {
  try {
    const r = await fetch('/api/starred');
    const data = await r.json();
    jobs = Array.isArray(data) ? data : (data.jobs || []);
    render();
  } catch(e) {
    showToast('加载失败: ' + e.message, 'error');
  }
}

function showJd(id) {
  const j = jobs.find(x => x.id === id);
  if (!j) return;
  document.getElementById('modalTitle').textContent = `${j.job_title || '岗位 JD'} — ${j.company || ''}`;
  document.getElementById('modalBody').textContent = j.jd_text || '（无 JD 内容）';
  document.getElementById('modalMask').classList.add('show');
}

function closeModal() {
  document.getElementById('modalMask').classList.remove('show');
}

async function delJob(id) {
  if (!confirm('确定删除该超预期岗位收藏？')) return;
  try {
    const r = await fetch('/api/starred/' + id, { method: 'DELETE' });
    const d = await r.json();
    if (d.success) {
      showToast('✅ 已删除', 'success');
      refresh();
    } else {
      showToast('删除失败: ' + (d.error || ''), 'error');
    }
  } catch(e) {
    showToast('删除失败: ' + e.message, 'error');
  }
}

async function clearAll() {
  if (!jobs.length) { showToast('暂无记录', 'info'); return; }
  if (!confirm('确定清空全部超预期岗位收藏？此操作不可恢复！')) return;
  try {
    const r = await fetch('/api/starred/clear', { method: 'POST' });
    const d = await r.json();
    if (d.success) {
      showToast(`✅ 已清空 ${d.cleared || 0} 条`, 'success');
      refresh();
    } else {
      showToast('清空失败: ' + (d.error || ''), 'error');
    }
  } catch(e) {
    showToast('清空失败: ' + e.message, 'error');
  }
}

// 每 30 秒自动刷新（引擎运行时会持续新增）
refresh();
setInterval(refresh, 30000);
</script>
</body>
</html>
